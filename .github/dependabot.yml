version: 2
updates:
  # Dependabot は `uses:` のタグと actions.lock の SHA を同じ commit で上げるので、
  # CI の actions-lock ジョブ (`gh actions-lock --verify`) を通る。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # devShell の bats / shellcheck / yamllint などの版は flake.lock の nixpkgs の
  # rev で決まる。nix の対象は flake.lock の input の更新だけで、security
  # updates は出ない。Brewfile は Dependabot に対応する ecosystem が無いので対象外。
  # 更新 PR は CI (.github/workflows/ci.yaml) の flake-check と bats-test で確かめる。
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
