# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# テストのツールは flake.nix の devShell から取る (usadamasa/gh-manage の setup-nix)。版の正本は flake.lock
jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Check flake
        run: task nix:check-flake

      - name: Evaluate home-manager configuration
        run: task hm:check

  bats-test:
    name: bats test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Run bats tests
        run: task test

      - name: Lint YAML
        run: task lint

  actions-lock:
    name: actions-lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/verify-actions-lock@main

  ci-status-check:
    runs-on: ubuntu-slim
    if: always()
    timeout-minutes: 10
    needs:
      - flake-check
      - bats-test
      - actions-lock
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
