# Determinate Nix が /etc/nix/nix.conf から !include する system 側の設定。
# task nix:install-custom-conf が /etc/nix/nix.custom.conf へ sudo でコピーする
# (root の daemon にユーザー所有のファイルを辿らせないため、symlink にしない)。

# ~/.nix-profile などを $XDG_STATE_HOME/nix/ 配下へ置く。
# user 側の ~/.config/nix/nix.conf に書くと client が daemon へ転送し、trusted user でないため
# 「ignoring the client-specified setting」の警告が毎回出る (#101)。system 側の設定は転送されない。
use-xdg-base-directories = true
