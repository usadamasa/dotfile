onboarding = false
[theme]
name = "gruvbox-light"
auto_switch = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

sidebar_width = 36
sidebar_min_width = 36

prompt_new_tab_name = false

agent_panel_sort = "priority"

# ペイン間の隙間を詰める (共有の仕切り線だけにする)。
pane_gaps = false

# タブ行は常に表示する。ワークスペースは 1 タブで運用することが多く、隠すと
# タブの存在自体とアクティブなタブ名が画面から消えてしまう。
hide_tab_bar_when_single_tab = false

# 選択しただけでクリップボードへコピー。Ghostty 側にも copy-on-select はあるが、
# マウスを握っているのは herdr なので実効はこちら。
copy_on_select = true

# サイドバーの行構成。エージェントは「状態 + workspace」と端末タイトルの 2 行、
# space は「状態 + workspace」「ブランチ」「Claude のセッション名」の 3 行。
# 値の無い行は詰められる。
#
# space の行を 1 行に詰めると、幅 36 では workspace 名とブランチ名の両方が省略記号で
# 潰れて読めない。行を分けるとどちらも全長で出る。
#
# $branch と $claude は claude-config リポジトリの
# shared/hooks/herdr-claude-title.sh が workspace metadata へ報告する
# カスタムトークン。hook を外すとどちらの行も消える。
#
#   $claude  セッション名。space 側に端末タイトルの built-in トークンが無い。
#   $branch  セッションが今いるブランチ。built-in の branch は pane の cwd から
#            引くので worktree へ移ったセッションを追わない。両方を並べると
#            派生元と派生先の対に見えるが、Claude Code の worktree は既定
#            ブランチから fresh に切られるので、その読み方は誤り。そのため
#            built-in は使わず置き換える。
#
# git_status も built-in で pane の cwd から引く。worktree にいるセッションでは
# $branch と別の checkout を指すため外してある。
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["$branch"],
  ["$claude"],
]

[keys]
# 既定の prefix 方式は残したまま、よく使う操作にだけ直接バインドを足す。
# 直接バインドしたキーは herdr が横取りするため、ペイン内のアプリ
# (shell / vim / エージェント本体) には届かなくなる点に注意。

# ここから下の cmd 系と ctrl+tab は Ghostty が CSI-u で転送してくるキー。
# config/ghostty/config の keybind = cmd+... = csi:... と対で維持する。

# タブ移動: shift + ←/→ (↑/↓ も同義)、cmd + shift + [ / ]、ctrl + tab
previous_tab = ["shift+left", "shift+up", "cmd+shift+[", "ctrl+shift+tab"]
next_tab = ["shift+right", "shift+down", "cmd+shift+]", "ctrl+tab"]

# ペイン分割: cmd + enter で下、cmd + shift + enter で右
# cmd + d / cmd + shift + d は Ghostty 既定の new_split と同じ向きに合わせる。
split_horizontal = ["prefix+minus", "cmd+enter", "cmd+shift+d"]
split_vertical = ["prefix+v", "cmd+shift+enter", "cmd+d"]

# ペイン移動: cmd + 矢印、循環は cmd + [ / ]
focus_pane_left = ["prefix+h", "cmd+left"]
focus_pane_down = ["prefix+j", "cmd+down"]
focus_pane_up = ["prefix+k", "cmd+up"]
focus_pane_right = ["prefix+l", "cmd+right"]
cycle_pane_previous = ["prefix+shift+tab", "cmd+["]
cycle_pane_next = ["prefix+tab", "cmd+]"]

# ペインを閉じる: cmd + w
close_pane = ["prefix+x", "cmd+w"]

# 新しい space (workspace): cmd + n
# ctrl + n は cmd + n が使えなかった頃の名残。shell の履歴移動を奪うので、
# cmd + n が安定して効くなら外してよい。
new_workspace = ["prefix+shift+n", "ctrl+n", "cmd+n"]

# 新しいタブ: cmd + t
new_tab = ["prefix+c", "cmd+t"]

# ペインのリサイズ: cmd + ctrl + 矢印
# resize_mode (prefix+r) に入らず直接リサイズする。
resize_pane_left = ["ctrl+cmd+left"]
resize_pane_down = ["ctrl+cmd+down"]
resize_pane_up = ["ctrl+cmd+up"]
resize_pane_right = ["ctrl+cmd+right"]

# 新しいエージェント (claude): ctrl + option + n
# 現在のペインを分割し、空いたペインで claude を起動する。
[[keys.command]]
key = "ctrl+alt+n"
type = "shell"
command = "\"$HOME/.config/herdr/herdr-new-agent.sh\" claude"
description = "start a new claude agent in a sibling pane"

# フローティングの scratch shell: prefix + shift + c
# popup は中のコマンドが終わると閉じる。Ghostty の quick terminal は
# command = herdr を起動して既存セッションへ attach してしまうので使えない。
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "zsh"
width = "90%"
height = "85%"
description = "floating shell popup"
